name: Alhambra Identity

on:
  push:
    paths:
      - "packages/alhambra_identity/**"
      - "packages/alhambra_core/**"
      - ".github/workflows/alhambra-identity.yml"
  pull_request:
    paths:
      - "packages/alhambra_identity/**"
      - "packages/alhambra_core/**"
      - ".github/workflows/alhambra-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-package:
    name: Analyze and test identity package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/alhambra_identity
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: dart test
