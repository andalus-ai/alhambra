name: alhambra
description: "Alhambra — Agnostic plugin-based workbench platform (shell, navigation, settings, plugin system)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  alhambra_plugin_api:
    path: ../packages/alhambra_plugin_api
  alhambra_plugin_runtime:
    path: ../packages/alhambra_plugin_runtime
  alhambra_extension:
    path: ../packages/alhambra_extension
  alhambra_workspace:
    path: ../packages/alhambra_workspace
  alhambra_knowledge:
    path: ../packages/alhambra_knowledge
  alhambra_platform:
    path: ../packages/alhambra_platform
  alhambra_sdk:
    path: ../packages/alhambra_sdk
  alhambra_plugin_project:
    path: ../packages/alhambra_plugin_project
  alhambra_coding_core:
    path: ../../../AlhambraCoder/Community/UI/packages/alhambra_coding_core
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  objectbox: ^5.3.2
  objectbox_flutter_libs: any
  flutter_riverpod: ^3.4.1
  file_picker: ^8.0.3
  gap: ^3.0.1
  grpc: ^5.1.0
  protobuf: ^6.0.0
  fixnum: ^1.1.1
  hive_flutter: ^1.1.0
  http: ^1.6.0
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3
  google_fonts: ^8.2.1
  tenun: ^0.1.3
  uuid: ^4.6.0

  riverpod: any
dev_dependencies:
  build_runner: any
  objectbox_generator: any
  flutter_launcher_icons: "^0.14.1"
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_gen_runner:
  mocktail: ^1.0.4


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/alhambra-logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icons/alhambra-logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/icons/alhambra-logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icons/alhambra-logo.png"


flutter:
  generate: true
  uses-material-design: true

  assets:
  - assets/images/
  - assets/icons/
  - assets/audio/
  - assets/fonts/
  - assets/data/
  - pubspec.yaml
