name: alhambra_ui
description: Reusable application shell, responsive layouts, components, design system, and workspace UI infrastructure for the Alhambra Platform.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.11.0
  alhambra_core:
    path: ../alhambra_core
  alhambra_identity:
    path: ../alhambra_identity
  alhambra_workspace:
    path: ../alhambra_workspace
  alhambra_services:
    path: ../alhambra_services

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
